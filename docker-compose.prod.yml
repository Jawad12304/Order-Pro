version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: orderpro_postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-Jd123004@}
      POSTGRES_DB: orderpro
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./orderpro_production_dump.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orderpro"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: orderpro_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: orderpro_api
    restart: always
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=postgresql://postgres:${DB_PASSWORD:-Jd123004@}@postgres:5432/orderpro?schema=public
      - DIRECT_URL=postgresql://postgres:${DB_PASSWORD:-Jd123004@}@postgres:5432/orderpro?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:-replace-with-a-strong-random-secret-for-access-tokens}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-replace-with-a-different-strong-random-secret-for-refresh-tokens}
      - MASTER_PASSWORD=${MASTER_PASSWORD:-Jd123004@}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET:-your-supabase-jwt-secret}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3001/api}
        - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    container_name: orderpro_web
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://postgres:${DB_PASSWORD:-Jd123004@}@postgres:5432/orderpro?schema=public
      - DIRECT_URL=postgresql://postgres:${DB_PASSWORD:-Jd123004@}@postgres:5432/orderpro?schema=public
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3001/api}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:-replace-with-a-strong-random-secret-for-access-tokens}
    depends_on:
      - api
      - postgres

volumes:
  postgres_data:
  redis_data:
